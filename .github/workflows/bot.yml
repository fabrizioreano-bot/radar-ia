name: Ejecutar Bot Radar IA

on:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta automáticamente cada 30 minutos
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ejecutar Bot
        run: python bot.py

      - name: Guardar y publicar cambios dinámicos
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos.json
          git commit -m "Auto-update: Datos actualizados por Bot RADAR IA" || exit 0
          git push
