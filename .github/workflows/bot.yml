name: B-IA Bot - Scraping con Playwright

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar Chromium y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: 4. Ejecutar Bot Scraper
        run: python bot.py

      - name: 5. Guardar cambios
        run: |
          git config --global user.name "B-IA Automator"
          git config --global user.email "bot@b-ia.com"
          git add datos.json historico/ || true
          git commit -m "🤖 Actualización automática del bot" || echo "Sin cambios"
          git push
