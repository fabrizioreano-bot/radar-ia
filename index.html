<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-IA | Radar de Mercado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0 border-r border-slate-800">
      <div class="p-6 text-2xl font-black tracking-wider border-b border-slate-800 flex items-center justify-between">
        <div><span>B-</span><span class="text-orange-500">IA</span></div>
      </div>
      
      <div class="px-4 pt-4 pb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Módulos</div>
      <nav class="px-2 space-y-1 font-semibold flex-1">
        <button id="nav-recargas" onclick="cambiarTipo('recarga')" class="w-full text-left flex items-center gap-3 px-4 py-3 bg-orange-600 text-white rounded-xl shadow-lg transition">
          <i class="fa-solid fa-wallet w-5"></i> Recargas
        </button>
        <button id="nav-retiros" onclick="cambiarTipo('retiro')" class="w-full text-left flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition">
          <i class="fa-solid fa-money-bill-transfer w-5"></i> Retiros
        </button>
      </nav>

      <!-- Selector de Periodo Semanal -->
      <div class="p-4 border-t border-slate-800">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Periodo (Mes y Semana):</label>
        
        <select id="select-mes" onchange="actualizarPantalla()" class="w-full mb-2 bg-slate-950 border border-slate-700 text-slate-200 text-xs font-bold rounded-lg px-3 py-2 focus:outline-none">
          <option value="2026-10" selected>Octubre 2026</option>
          <option value="2026-11">Noviembre 2026</option>
        </select>

        <select id="select-semana" onchange="actualizarPantalla()" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs font-bold rounded-lg px-3 py-2 focus:outline-none">
          <option value="sem1">Semana 1</option>
          <option value="sem2">Semana 2</option>
          <option value="sem3" selected>Semana 3</option>
          <option value="sem4">Semana 4</option>
        </select>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-950">
      <header class="mb-8 flex justify-between items-center">
        <div>
          <h1 id="titulo-seccion" class="text-3xl font-extrabold text-white flex items-center gap-3">
            <i class="fa-solid fa-wallet text-orange-500"></i> Métodos de Recarga
          </h1>
          <p class="text-slate-400 text-sm mt-1">Imágenes centralizadas desde el repositorio de evidencias.</p>
        </div>
      </header>

      <div id="contenedor-dinamico" class="pb-10"></div>
    </main>
  </div>

  <!-- Modal Zoom -->
  <div id="modal-zoom" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-50" onclick="cerrarZoom()">
    <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center">
      <button onclick="cerrarZoom()" class="absolute -top-10 right-0 text-white text-xs font-bold bg-slate-800 px-3 py-1 rounded-lg">Cerrar (Esc)</button>
      <img id="img-zoom" src="" class="max-h-[80vh] rounded-xl shadow-2xl border border-slate-700 object-contain">
    </div>
  </div>

  <script>
    const USUARIO = "fabrizioreano-bot";
    const REPO = "evidencias-caja";

    const marcas = [
      { id: "te-apuesto", nombre: "Te Apuesto", color: "from-red-600 to-orange-600" },
      { id: "doradobet", nombre: "DoradoBet", color: "from-amber-500 to-yellow-600" },
      { id: "betano", nombre: "Betano", color: "from-orange-600 to-red-600" },
      { id: "betsson", nombre: "Betsson", color: "from-amber-600 to-orange-500" },
      { id: "apuesta-total", nombre: "Apuesta Total", color: "from-red-700 to-slate-900" },
      { id: "olimpo", nombre: "Olimpo.bet", color: "from-blue-600 to-indigo-700" }
    ];

    let tipoActual = 'recarga';

    function cambiarTipo(tipo) {
      tipoActual = tipo;
      document.getElementById('nav-recargas').className = (tipo === 'recarga') ? "w-full text-left flex items-center gap-3 px-4 py-3 bg-orange-600 text-white rounded-xl shadow-lg transition" : "w-full text-left flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition";
      document.getElementById('nav-retiros').className = (tipo === 'retiro') ? "w-full text-left flex items-center gap-3 px-4 py-3 bg-orange-600 text-white rounded-xl shadow-lg transition" : "w-full text-left flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition";
      
      document.getElementById('titulo-seccion').innerHTML = tipo === 'recarga' 
          ? '<i class="fa-solid fa-wallet text-orange-500"></i> Métodos de Recarga'
          : '<i class="fa-solid fa-money-bill-transfer text-emerald-500"></i> Métodos de Retiro';
      
      actualizarPantalla();
    }

    function actualizarPantalla() {
      const mes = document.getElementById('select-mes').value;
      const semana = document.getElementById('select-semana').value;
      const contenedor = document.getElementById('contenedor-dinamico');
      
      let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
      marcas.forEach(marca => {
        const nombreArchivo = `${marca.id}-${tipoActual}-${mes}-${semana}.png`;
        const urlFoto = `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/${nombreArchivo}?v=${new Date().getTime()}`;

        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
            <div class="p-4 bg-gradient-to-r ${marca.color} flex justify-between items-center">
              <h3 class="text-lg font-bold text-white">${marca.nombre}</h3>
            </div>
            
            <div class="p-4 flex-1 flex items-center justify-center">
              <div class="relative group cursor-pointer w-full bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center min-h-[220px]" onclick="abrirZoom('${urlFoto}')">
                <img src="${urlFoto}" class="w-full h-56 object-cover object-top rounded-xl" 
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\"p-6 text-center text-xs text-slate-500\"><i class=\"fa-regular fa-image text-3xl mb-2 block text-slate-600\"></i>Falta subir foto en tu repositorio:<br><strong class=\"text-orange-400 mt-2 block font-mono\">${nombreArchivo}</strong></div>';">
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      contenedor.innerHTML = html;
    }

    function abrirZoom(foto) {
      document.getElementById('img-zoom').src = foto;
      document.getElementById('modal-zoom').classList.remove('hidden');
    }
    function cerrarZoom() { document.getElementById('modal-zoom').classList.add('hidden'); }

    actualizarPantalla();
  </script>
</body>
</html>
