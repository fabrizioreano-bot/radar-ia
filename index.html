<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar IA - B-IA Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
      <div class="p-6 text-2xl font-black tracking-wider border-b border-slate-800 flex items-center gap-2">
        <span>B-</span><span class="text-orange-500">IA</span>
      </div>
      <nav class="flex-1 p-4 space-y-2 font-semibold">
        <a href="#" class="flex items-center gap-3 px-4 py-3 bg-orange-600 text-white rounded-xl shadow-lg transition">
          <i class="fa-solid font-bold fa-wallet"></i> Métodos de Recarga
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <i class="fa-solid fa-hand-holding-dollar"></i> Cobros y Retiros
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <i class="fa-solid fa-trophy"></i> Apuestas Deportivas
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <i class="fa-solid fa-sliders"></i> Flujos UX
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-50">
      <header class="mb-6 flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold text-slate-900">Métodos de Recarga</h1>
          <p class="text-slate-500 text-sm mt-1">Consulta los canales disponibles y sus tiempos estimados de acreditación.</p>
        </div>
        <div id="fecha-actualizacion" class="text-xs font-semibold px-4 py-2 bg-slate-200 text-slate-700 rounded-full shadow-sm">
          Cargando estado...
        </div>
      </header>

      <!-- Tabla Principal -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="grid grid-cols-12 bg-slate-100 p-4 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
          <div class="col-span-3">Operador</div>
          <div class="col-span-9">Canales y Tiempos de Recarga</div>
        </div>

        <div id="contenedor-operadores" class="divide-y divide-slate-100">
          <div class="p-8 text-center text-slate-400">Cargando datos del bot...</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function cargarDatos() {
      try {
        const respuesta = await fetch('datos.json?v=' + new Date().getTime());
        const data = await respuesta.json();

        // Actualizar hora
        if(data.ultima_actualizacion) {
          document.getElementById('fecha-actualizacion').innerText = data.ultima_actualizacion;
        }

        const contenedor = document.getElementById('contenedor-operadores');
        contenedor.innerHTML = '';

        if (!data.operadores || data.operadores.length === 0) {
          contenedor.innerHTML = '<div class="p-8 text-center text-slate-400">No hay información disponible.</div>';
          return;
        }

        data.operadores.forEach(op => {
          let recargasHtml = '';
          
          if(op.recargas && op.recargas.length > 0) {
            recargasHtml = op.recargas.map(r => `
              <div class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-700 transition cursor-pointer" title="Límites: ${r.min_recarga || 'S/ 10'} a ${r.max_recarga || 'S/ 5,000'}">
                <span>${r.canal}</span>
                <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md">${r.tiempo}</span>
              </div>
            `).join('');
          } else {
            recargasHtml = '<span class="text-xs text-slate-400 italic">Sin datos de recarga</span>';
          }

          const fila = `
            <div class="grid grid-cols-12 p-4 items-center hover:bg-slate-50/80 transition">
              <div class="col-span-3 flex items-center gap-3 font-bold text-slate-800">
                <div class="w-8 h-8 bg-slate-900 text-white flex items-center justify-center rounded-lg text-xs font-black">${op.logo || op.nombre.substring(0,2)}</div>
                <span>${op.nombre}</span>
              </div>
              <div class="col-span-9 flex flex-wrap gap-2">
                ${recargasHtml}
              </div>
            </div>
          `;
          contenedor.innerHTML += fila;
        });

      } catch (error) {
        console.error("Error al cargar JSON:", error);
        document.getElementById('contenedor-operadores').innerHTML = `
          <div class="p-8 text-center text-red-500 font-semibold">
            ❌ Error al cargar los datos. Verifica que el archivo datos.json esté subido correctamente.
          </div>
        `;
      }
    }

    // Ejecutar al cargar
    cargarDatos();
  </script>
</body>
</html>
